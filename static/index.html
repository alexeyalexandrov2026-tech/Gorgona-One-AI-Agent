<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GORGONA — AI Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

  <!-- =========================================================
       SIDEBAR
       ========================================================= -->

  <aside class="sidebar" id="sidebar">

    <div class="logo">
      <div class="logo-symbol">
        <span class="logo-ray"></span>
        <span class="logo-ray"></span>
        <span class="logo-ray"></span>
      </div>
      <div class="logo-wordmark">
        <div class="logo-main">GORGONA</div>
        <div class="logo-sub">ONE</div>
      </div>
    </div>

    <button class="new-chat" id="btn-new-chat">
      <span class="plus">+</span>
      <span>Новый чат</span>
    </button>

    <div class="conversations" id="conversation-list">
      <!-- Conversation history items will appear here -->
    </div>

    <div class="sidebar-bottom">

      <div class="sidebar-link" id="btn-settings">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3.2" stroke="currentColor" />
          <path
            d="M19.4 15a1.8 1.8 0 0 0 .36 1.99l.06.06-1.4 1.4-.06-.06a1.8 1.8 0 0 0-1.99-.36 1.8 1.8 0 0 0-1.09 1.65V20h-2v-.32a1.8 1.8 0 0 0-1.1-1.65 1.8 1.8 0 0 0-1.98.36l-.06.06-1.4-1.4.06-.06A1.8 1.8 0 0 0 9.2 15a1.8 1.8 0 0 0-1.65-1.09H7.2v-2h.35A1.8 1.8 0 0 0 9.2 10a1.8 1.8 0 0 0-.36-1.99l-.06-.06 1.4-1.4.06.06a1.8 1.8 0 0 0 1.98.36A1.8 1.8 0 0 0 13.32 5.3V5h2v.3a1.8 1.8 0 0 0 1.09 1.66 1.8 1.8 0 0 0 1.99-.36l.06-.06 1.4 1.4-.06.06A1.8 1.8 0 0 0 19.4 10c.22.53.74.91 1.32.91H21v2h-.28A1.8 1.8 0 0 0 19.4 15Z"
            stroke="currentColor"
            stroke-width="1.2"
          />
        </svg>
        <span>Настройки</span>
      </div>

      <div class="sidebar-link">
        <svg viewBox="0 0 24 24" fill="none">
          <path
            d="M5 4.5h11.5A2.5 2.5 0 0 1 19 7v12.5H7.5A2.5 2.5 0 0 1 5 17V4.5Z"
            stroke="currentColor"
            stroke-width="1.5"
          />
          <path
            d="M5 17.5A2.5 2.5 0 0 1 7.5 15H19"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>
        <span>База знаний</span>
      </div>

      <div class="sidebar-status">
        <div class="status-dot"></div>
        <span id="agent-status-text">Ожидает ввода...</span>
      </div>

      <div class="profile">
        <div class="profile-avatar">G</div>
        <div class="profile-name">Gorgona</div>
        <div class="profile-chevron">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="m7 10 5 5 5-5" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </div>
      </div>

    </div>

  </aside>


  <!-- Mobile sidebar overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>


  <!-- =========================================================
       MAIN
       ========================================================= -->

  <main class="main">

    <!-- HEADER -->
    <header class="chat-header">

      <button class="mobile-menu" id="btn-mobile-menu" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>

      <div class="chat-title">
        <span>Новый чат</span>
        <svg class="chat-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="m7 9 5 5 5-5" stroke="currentColor" stroke-width="1.7" />
        </svg>
      </div>

      <div class="header-actions">
        <div class="model-selector">
          <select id="model-select" class="cyber-select">
            <option value="smart">Gorgona Smart Engine</option>
            <option value="ollama">Локальная (Ollama)</option>
            <option value="gemini">Gemini Pro</option>
            <option value="openai">ChatGPT-4o</option>
            <option value="openrouter">Claude 3.5 (OpenRouter)</option>
            <option value="free">Free AI (Без ключей)</option>
          </select>
        </div>

        <select id="theme-select" class="model-select" title="Тема">
          <option value="default">Default</option>
          <option value="russian">Russian Blue/Red</option>
        </select>

        <button class="header-button" aria-label="Favorite">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="m12 3.8 2.55 5.17 5.71.83-4.13 4.03.98 5.69L12 16.83l-5.11 2.69.98-5.69-4.13-4.03 5.71-.83L12 3.8Z"
              stroke="currentColor" stroke-width="1.7"
            />
          </svg>
        </button>

        <button class="header-button" aria-label="Share">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 16V4" stroke="currentColor" stroke-width="1.7" />
            <path d="m8 8 4-4 4 4" stroke="currentColor" stroke-width="1.7" />
            <path d="M5 12v6.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V12" stroke="currentColor" stroke-width="1.7" />
          </svg>
        </button>
      </div>

    </header>


    <!-- CHAT -->
    <div class="chat-scroll">
      <div class="chat-content" id="chat-feed">

        <!-- Welcome state -->
        <div class="welcome system-welcome" id="welcome-screen">
          <div class="welcome-avatar">G</div>
          <h2 class="welcome-title">Gorgona One</h2>
          <p class="welcome-subtitle">Чем могу помочь сегодня?</p>
        </div>

      </div>
    </div>

    <!-- EXECUTION STEPS (inline, below chat) -->
    <div id="agent-box" class="agent-steps-bar hidden">
      <div class="steps-inner" id="execution-steps"></div>
    </div>


    <!-- COMPOSER -->
    <div class="composer-area">
      <div class="composer">

        <textarea
          class="composer-input"
          id="prompt-input"
          placeholder="Напишите сообщение Gorgona..."
          rows="2"
        ></textarea>

        <div class="composer-bottom">
          <div class="composer-tools">

            <!-- Attachment -->
            <input type="file" id="file-upload" hidden accept="image/*">
            <button class="composer-tool" id="btn-attach" aria-label="Прикрепить файл" title="Прикрепить файл">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="m20 12.5-7.4 7.4a5 5 0 0 1-7.1-7.1l7.8-7.8a3.5 3.5 0 0 1 5 5l-7.9 7.9a2 2 0 0 1-2.8-2.8l7.2-7.2"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.7"
                />
              </svg>
            </button>

            <!-- Mention -->
            <button class="composer-tool" aria-label="Mention">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.7" />
                <path
                  d="M15.5 14.5c-1.1 1-2.2 1.5-3.5 1.5-2.2 0-4-1.6-4-4s1.8-4 4-4 4 1.6 4 4v1.5c0 .8.5 1.5 1.3 1.5 1 0 2.2-1 2.2-3"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.7"
                />
              </svg>
            </button>

            <!-- Web search -->
            <button class="composer-tool" aria-label="Web search">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7" />
                <path
                  d="M3.8 12h16.4M12 3.5c2 2.3 3 5.1 3 8.5s-1 6.2-3 8.5c-2-2.3-3-5.1-3-8.5s1-6.2 3-8.5Z"
                  stroke="currentColor"
                  stroke-width="1.7"
                />
              </svg>
            </button>

          </div>

          <!-- SEND -->
          <button class="send" id="btn-send" aria-label="Отправить">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 19V5" stroke="currentColor" stroke-linecap="round" stroke-width="1.8" />
              <path d="m6.5 10.5 5.5-5.5 5.5 5.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
            </svg>
          </button>
        </div>

      </div>
    </div>

  </main>


  <!-- =========================================================
       SETTINGS MODAL
       ========================================================= -->

  <div class="modal-overlay hidden" id="modal-settings">
    <div class="modal-card">

      <div class="modal-header">
        <h3>Настройки API</h3>
        <button class="modal-close" id="btn-close-modal" aria-label="Закрыть">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <label class="modal-label">
          Gemini API Key
          <input type="password" id="input-gemini-key" class="modal-input" placeholder="AIza..." />
        </label>
        <label class="modal-label">
          OpenAI API Key
          <input type="password" id="input-openai-key" class="modal-input" placeholder="sk-..." />
        </label>
        <label class="modal-label">
          OpenRouter API Key
          <input type="password" id="input-openrouter-key" class="modal-input" placeholder="sk-or-..." />
        </label>
        <label class="modal-label">
          Ollama API Key (Cloud)
          <input type="password" id="input-ollama-key" class="modal-input" placeholder="Ollama Cloud API Key..." />
        </label>
        <label class="modal-label">
          Ollama URL
          <input type="text" id="input-ollama-url" class="modal-input" placeholder="http://localhost:11434 или https://ollama.com" />
        </label>
        <label class="modal-label">
          Free AI (No-Cost)
          <input type="text" class="modal-input" value="Ключи не требуются (Pollinations AI, G4F)" disabled />
        </label>
      </div>

      <div class="modal-footer">
        <button class="modal-btn-save" id="btn-save-settings">Сохранить</button>
      </div>

    </div>
  </div>


  <!-- Toast notification -->
  <div class="toast hidden" id="toast"></div>


  <script src="app.js?v=5"></script>
</body>
</html>
