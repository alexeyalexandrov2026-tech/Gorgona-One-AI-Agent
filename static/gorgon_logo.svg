<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gorgon_grad" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#3D8CFF"/>
      <stop offset="100%" stop-color="#1E4B91"/>
    </linearGradient>
    <linearGradient id="snake_grad" x1="0" y1="100" x2="100" y2="0">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#3D8CFF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="50" cy="50" r="48" fill="#080C12" stroke="url(#gorgon_grad)" stroke-width="2"/>
  
  <!-- Abstract Tech Snakes -->
  <path d="M 50 12 C 25 15, 10 35, 15 60 C 25 50, 20 25, 45 20" stroke="url(#snake_grad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 50 12 C 75 15, 90 35, 85 60 C 75 50, 80 25, 55 20" stroke="url(#snake_grad)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 12 45 C 10 70, 25 90, 50 88 C 30 80, 20 65, 22 40" stroke="url(#snake_grad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 88 45 C 90 70, 75 90, 50 88 C 70 80, 80 65, 78 40" stroke="url(#snake_grad)" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Cyber-Gorgon Face Plate -->
  <path d="M 38 32 L 62 32 L 68 55 L 50 72 L 32 55 Z" fill="url(#gorgon_grad)" />
  <path d="M 38 32 L 62 32 L 68 55 L 50 72 L 32 55 Z" fill="none" stroke="#00FFFF" stroke-width="1" opacity="0.5"/>
  
  <!-- Glowing Eyes -->
  <path d="M 39 46 L 46 49 M 61 46 L 54 49" stroke="#00FFFF" stroke-width="2" filter="url(#glow)"/>
  <circle cx="44" cy="51" r="2.5" fill="#00FFFF" filter="url(#glow)"/>
  <circle cx="56" cy="51" r="2.5" fill="#00FFFF" filter="url(#glow)"/>
  
  <!-- Cybernetic Mouth/Fangs -->
  <path d="M 47 62 L 50 65 L 53 62" stroke="#00FFFF" stroke-width="1.5" fill="none" filter="url(#glow)"/>
  
  <!-- Center gem -->
  <polygon points="50,22 53,28 50,34 47,28" fill="#00FFFF" filter="url(#glow)"/>
</svg>
